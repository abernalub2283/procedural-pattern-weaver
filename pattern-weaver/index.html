<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Weaver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🧵 Pattern Weaver 🧵</h1>
    <p class="subtitle">Procedural scarf patterns, woven to order</p>
    <div id="controls">
        <label>Cast-on between
            <input type="number" id="min-sts" value="32" min="8">
            and
            <input type="number" id="max-sts" value="48" min="8">
        </label>
        <label>Length (inches):
            <input type="number" id="length" value="60" min="12">
        </label>
        <button id="weave-btn">Weave a Pattern</button>
    </div>
    <div id="pattern"></div>

    <script>
        const seedStitches = [
            { "name": "Rope Cable", "type": "cable", "stitches": 4, "offset": 0, "rows": 6, "difficulty": 1, "yarnMultiplier": 1.3, "instructions": ["Row 1 (RS): K4.", "Row 2 (WS): P4.", "Row 3: K4.", "Row 4: P4.", "Row 5: C4F — slip 2 sts to cable needle, hold in front, K2, then K2 from cable needle.", "Row 6: P4."] },
            { "name": "Honeycomb Cable", "type": "cable", "stitches": 8, "offset": 0, "rows": 8, "difficulty": 2, "yarnMultiplier": 1.5, "instructions": ["Row 1 (RS): C4B, C4F. (C4B: slip 2 sts to cable needle, hold in back, K2, K2 from cable needle; C4F: hold in front.)", "Row 2 (WS): P8.", "Row 3: K8.", "Row 4: P8.", "Row 5: C4F, C4B.", "Row 6: P8.", "Row 7: K8.", "Row 8: P8."] },
            { "name": "Braid Cable", "type": "cable", "stitches": 6, "offset": 0, "rows": 8, "difficulty": 2, "yarnMultiplier": 1.4, "instructions": ["Row 1 (RS): K6.", "Row 2 (WS): P6.", "Row 3: C6B — slip 3 sts to cable needle, hold in back, K3, K3 from cable needle.", "Row 4: P6.", "Row 5: K6.", "Row 6: P6.", "Row 7: C6F — slip 3 sts to cable needle, hold in front, K3, K3 from cable needle.", "Row 8: P6."] },
            { "name": "Feather and Fan", "type": "lace", "stitches": 18, "offset": 0, "rows": 4, "difficulty": 2, "yarnMultiplier": 0.9, "instructions": ["Row 1 (RS): K2tog 3 times, (YO, K1) 6 times, K2tog 3 times. (18 sts)", "Row 2 (WS): Knit.", "Row 3: Knit.", "Row 4: Knit."] },
            { "name": "Eyelet Columns", "type": "lace", "stitches": 6, "offset": 0, "rows": 4, "difficulty": 1, "yarnMultiplier": 0.95, "instructions": ["Row 1 (RS): K2, YO, K2tog, K2.", "Row 2 (WS): P6.", "Row 3: K6.", "Row 4: P6."] },
            { "name": "Seed Stitch", "type": "texture", "stitches": 2, "offset": 0, "rows": 2, "difficulty": 1, "yarnMultiplier": 1.1, "instructions": ["Row 1: *K1, P1; repeat from *.", "Row 2: *P1, K1; repeat from *. (Knit the purls and purl the knits.)"] },
            { "name": "Moss Stitch", "type": "texture", "stitches": 2, "offset": 0, "rows": 4, "difficulty": 1, "yarnMultiplier": 1.15, "instructions": ["Row 1: *K1, P1; repeat from *.", "Row 2: *K1, P1; repeat from *.", "Row 3: *P1, K1; repeat from *.", "Row 4: *P1, K1; repeat from *."] },
            { "name": "Basketweave", "type": "texture", "stitches": 8, "offset": 0, "rows": 8, "difficulty": 1, "yarnMultiplier": 1.1, "instructions": ["Rows 1-4: *K4, P4; repeat from *.", "Rows 5-8: *P4, K4; repeat from *."] },
            { "name": "Garter Stitch", "type": "texture", "stitches": 1, "offset": 0, "rows": 2, "difficulty": 1, "yarnMultiplier": 1.1, "instructions": ["Row 1: Knit.", "Row 2: Knit."] },
            { "name": "Stockinette Stitch", "type": "texture", "stitches": 1, "offset": 0, "rows": 2, "difficulty": 1, "yarnMultiplier": 1.0, "instructions": ["Row 1: Knit.", "Row 2: Purl."] },
            { "name": "Sand Stitch", "type": "texture", "stitches": 2, "offset": 1, "rows": 2, "difficulty": 1, "yarnMultiplier": 1.1, "instructions": ["Row 1: Purl.", "Row 2: K1 *P1, K1; repeat from *."] }
        ];

        function pickRandom(array) {
            const index = Math.floor(Math.random() * array.length);
            return array[index];
        }

        function pickByType(stitches, types) {
            const matches = stitches.filter(function(s) {
                return types.indexOf(s.type) !== -1;
            });
            return pickRandom(matches);
        }

        function solveCastOn(center, edgeTotal, minSts, maxSts) {
            for (let n = 1; n <= 10; n++) {
                const total = center.stitches * n + center.offset + edgeTotal;
                if (total >= minSts && total <= maxSts) {
                    return { repeats: n, total: total };
                }
            }
            return null;
        }

        function gcd(a, b) {
            while (b !== 0) {
                const temp = b;
                b = a % b;
                a = temp;
            }
            return a;
        }

        function lcm(a, b) {
            return (a * b) / gcd(a, b);
        }

        function weave() {
            const minSts = parseInt(document.getElementById('min-sts').value, 10) || 32;
            const maxSts = parseInt(document.getElementById('max-sts').value, 10) || 48;
            const lengthInches = parseInt(document.getElementById('length').value, 10) || 60;

            const center = pickByType(seedStitches, ['cable', 'lace']);
            const edge = pickByType(seedStitches, ['texture']);
            const edgeTotal = edge.stitches * 4;
            const solution = solveCastOn(center, edgeTotal, minSts, maxSts);

            const box = document.getElementById('pattern');
            box.innerHTML = '';

            if (!solution) {
                const p = document.createElement('p');
                p.textContent = 'No cast-on found between ' + minSts + ' and ' + maxSts + ' — try a wider range.';
                box.appendChild(p);
                return;
            }

            const masterRows = lcm(center.rows, edge.rows);
            const edgePerSide = edgeTotal / 2;
            const centerSts = center.stitches * solution.repeats;

            const h2 = document.createElement('h2');
            h2.textContent = center.name + ' Scarf';
            box.appendChild(h2);

            const co = document.createElement('p');
            co.innerHTML = '<strong>Cast on ' + solution.total + ' stitches</strong> — ' + solution.repeats + ' repeats of ' + center.name + ' with ' + edge.name + ' edges.';
            box.appendChild(co);

            const guideH = document.createElement('h3');
            guideH.textContent = 'Stitch Guide';
            box.appendChild(guideH);
            [center, edge].forEach(function(motif) {
                const mh = document.createElement('h4');
                mh.textContent = motif.name + ' (' + motif.stitches + ' sts, ' + motif.rows + '-row repeat)';
                box.appendChild(mh);
                const ul = document.createElement('ul');
                motif.instructions.forEach(function(line) {
                    const li = document.createElement('li');
                    li.textContent = line;
                    ul.appendChild(li);
                });
                box.appendChild(ul);
            });

            const mrH = document.createElement('h3');
            mrH.textContent = 'Master Repeat — work until ' + lengthInches + ' inches';
            box.appendChild(mrH);
            const ol = document.createElement('ol');
            for (let r = 1; r <= masterRows; r++) {
                const centerRow = ((r - 1) % center.rows) + 1;
                const edgeRow = ((r - 1) % edge.rows) + 1;
                const li = document.createElement('li');
                li.textContent = edge.name + ' row ' + edgeRow + ' over ' + edgePerSide + ' sts; ' + center.name + ' row ' + centerRow + ', ' + solution.repeats + 'x over ' + centerSts + ' sts; ' + edge.name + ' row ' + edgeRow + ' over ' + edgePerSide + ' sts.';
                ol.appendChild(li);
            }
            box.appendChild(ol);

            const rowsPerInch = 6;
            const totalRows = Math.ceil(lengthInches * rowsPerInch / masterRows) * masterRows;
            const yardsPerRow = (centerSts * center.yarnMultiplier + edgeTotal * edge.yarnMultiplier) * 0.04;
            const totalYards = Math.ceil(yardsPerRow * totalRows * 1.1);
            const yd = document.createElement('p');
            yd.innerHTML = '<strong>Yardage (estimate):</strong> about ' + totalYards + ' yards, including a 10% buffer.';
            box.appendChild(yd);

            const fin = document.createElement('p');
            fin.className = 'finish';
            fin.textContent = 'Bind off in pattern. Weave in ends. Block lightly.';
            box.appendChild(fin);
        }

        document.getElementById('weave-btn').addEventListener('click', weave);
        weave();
    </script>
</body>
</html>
